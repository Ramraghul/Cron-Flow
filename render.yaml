# Render Blueprint — CronFlow API on free plans only (nothing here is billed).
# Spec: https://render.com/docs/blueprint-spec · Step-by-step guide: README → Deployment → Render
#
#   cronflow-api     Render web service, Free    API with the worker running in-process (Docker)
#   cronflow-redis   Render Key Value, Free      Redis for the job queue and cron schedules
#   PostgreSQL       Neon, Free (external)       permanent free database; Render's free Postgres expires after 30 days
#
# Free-plan behaviour:
#   * The web service sleeps after 15 minutes without traffic, and cron schedules cannot fire while it
#     sleeps. A free uptime monitor requesting /health/live every 5 minutes keeps it awake.
#   * Key Value data lives in memory only. The API re-registers every schedule from PostgreSQL when it
#     starts, so schedules survive restarts.
services:
  - type: web
    name: cronflow-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Liveness rather than readiness: /health/ready queries the database, and a health check polled around
    # the clock would keep Neon from ever suspending, using up its free compute hours.
    healthCheckPath: /health/live
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_MIGRATIONS
        value: "true"
      # Neon pooled connection string with &pgbouncer=true&connect_timeout=15 appended (you paste it on first deploy).
      - key: DATABASE_URL
        sync: false
      # Neon direct (non-pooled) connection string, used only to apply migrations at startup.
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cronflow-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      # Render terminates TLS at its proxy; trust one hop so rate limiting sees real client IPs.
      - key: TRUST_PROXY_HOPS
        value: "1"
      # The hosted dashboard. Add more origins comma-separated if needed.
      - key: CORS_ORIGINS
        value: https://cron-flow-ui.vercel.app
      # Background workers aren't available on the free plan, so jobs run inside the API process.
      - key: WORKER_ENABLED
        value: "true"
      - key: HTTP_STEP_ALLOW_PRIVATE_NETWORKS
        value: "false"
      - key: LOG_LEVEL
        value: info

  - type: keyvalue
    name: cronflow-redis
    plan: free
    region: singapore
    # BullMQ requires noeviction: evicting keys would silently drop queued jobs.
    maxmemoryPolicy: noeviction
    # An empty allow list keeps the instance reachable only from Render's private network.
    ipAllowList: []
